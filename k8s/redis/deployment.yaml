apiVersion: apps/v1
kind: Deployment

metadata:
  name: redis
  namespace: quantpulse

spec:
  # Pure cache + pub/sub broker -- nothing stored here is the source of
  # truth (Postgres is), so a restart losing everything is fine. No
  # volume, no StatefulSet, no replicas beyond 1: pub/sub messages aren't
  # partitioned across replicas by this app, so more than one would just
  # mean subscribers doing duplicate work for no benefit.
  replicas: 1

  # Recreate, not the default RollingUpdate -- with a single replica,
  # RollingUpdate briefly runs the old and new pod side by side under the
  # same Service, and Redis pub/sub is entirely in-memory per pod:
  # ingestion's publishes and the backend's WS subscribers can land on
  # different pods during that window, silently dropping every tick/alert
  # for whichever side missed them. A few seconds of downtime during a
  # Redis rollout is preferable to that split-brain window.
  strategy:
    type: Recreate

  selector:
    matchLabels:
      app: redis

  template:
    metadata:
      labels:
        app: redis

    spec:
      containers:
        - name: redis

          image: redis:7-alpine

          ports:
            - containerPort: 6379

          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6

          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3

        # Sidecar, not a separate Deployment -- it talks to Redis over
        # localhost, so it always scrapes the exact Redis instance this
        # pod is running, with no separate Service/DNS to keep in sync
        # and no risk of pointing at a stale pod during a Recreate
        # rollout. Reports true Redis-process metrics (memory, ops/sec,
        # connected clients) that app-level counters (cache.py,
        # stream.py) can't see from the client side.
        - name: redis-exporter

          image: oliver006/redis_exporter:v1.62.0

          env:
            - name: REDIS_ADDR
              value: "redis://localhost:6379"

          ports:
            - containerPort: 9121
              name: http-metrics
