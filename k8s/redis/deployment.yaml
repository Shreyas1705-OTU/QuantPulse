apiVersion: apps/v1
kind: Deployment

metadata:
  name: redis
  namespace: quantpulse

spec:
  # Pure cache + pub/sub broker -- nothing stored here is the source of
  # truth (Postgres is), so a restart losing everything is fine. No
  # volume, no StatefulSet, no replicas beyond 1: pub/sub messages aren't
  # partitioned across replicas by this app, so more than one would just
  # mean subscribers doing duplicate work for no benefit.
  replicas: 1

  selector:
    matchLabels:
      app: redis

  template:
    metadata:
      labels:
        app: redis

    spec:
      containers:
        - name: redis

          image: redis:7-alpine

          ports:
            - containerPort: 6379

          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6

          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
