apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard
  namespace: quantpulse
data:
  dashboard.json: |
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {
              "type": "grafana",
              "uid": "-- Grafana --"
            },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 0,
      "id": 1,
      "links": [],
      "panels": [
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {
            "defaults": {
              "mappings": [
                {"options": {"0": {"color": "dark-red", "index": 1, "text": "DOWN"}, "1": {"color": "dark-green", "index": 0, "text": "UP"}}, "type": "value"}
              ],
              "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": 0}]},
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {"h": 6, "w": 8, "x": 0, "y": 0},
          "id": 1,
          "options": {
            "colorMode": "background", "graphMode": "none", "justifyMode": "auto", "orientation": "auto",
            "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "textMode": "auto"
          },
          "pluginVersion": "12.2.0",
          "targets": [{"datasource": {"type": "prometheus", "uid": "prometheus"}, "editorMode": "code", "expr": "up{job=\"quantpulse-backend\"}", "legendFormat": "backend", "range": true, "refId": "A"}],
          "title": "Backend Status",
          "type": "stat"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {
            "defaults": {
              "mappings": [
                {"options": {"0": {"color": "dark-red", "index": 1, "text": "DOWN"}, "1": {"color": "dark-green", "index": 0, "text": "UP"}}, "type": "value"}
              ],
              "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": 0}]},
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {"h": 6, "w": 8, "x": 8, "y": 0},
          "id": 2,
          "options": {
            "colorMode": "background", "graphMode": "none", "justifyMode": "auto", "orientation": "auto",
            "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "textMode": "auto"
          },
          "pluginVersion": "12.2.0",
          "targets": [{"editorMode": "code", "expr": "redis_up", "legendFormat": "redis", "range": true, "refId": "A"}],
          "title": "Redis Status",
          "type": "stat"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {
            "defaults": {
              "mappings": [],
              "thresholds": {"mode": "absolute", "steps": [{"color": "red", "value": 0}, {"color": "yellow", "value": 80}, {"color": "green", "value": 95}]},
              "unit": "percent",
              "max": 100,
              "min": 0
            },
            "overrides": []
          },
          "gridPos": {"h": 6, "w": 8, "x": 16, "y": 0},
          "id": 3,
          "options": {
            "colorMode": "background", "graphMode": "none", "justifyMode": "auto", "orientation": "auto",
            "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "textMode": "auto"
          },
          "pluginVersion": "12.2.0",
          "targets": [{
            "editorMode": "code",
            "expr": "100 * sum(kube_job_status_succeeded) / clamp_min(sum(kube_job_status_succeeded) + sum(kube_job_status_failed), 1)",
            "legendFormat": "success rate",
            "range": true,
            "refId": "A"
          }],
          "title": "CronJob Success Rate",
          "description": "ai-explainer / ai-daily-summary / ai-symbol-summary job outcomes, from kube-state-metrics. A one-time cold-start DNS race (see project notes) shows up here as a brief dip, not a sustained one.",
          "type": "stat"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "palette-classic"},
              "custom": {
                "drawStyle": "line", "fillOpacity": 15, "gradientMode": "none", "lineInterpolation": "linear", "lineWidth": 2,
                "pointSize": 5, "showPoints": "auto", "spanNulls": false, "stacking": {"group": "A", "mode": "none"}
              },
              "mappings": [],
              "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": 0}]},
              "unit": "reqps"
            },
            "overrides": []
          },
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 6},
          "id": 4,
          "options": {"legend": {"calcs": [], "displayMode": "list", "placement": "bottom", "showLegend": true}, "tooltip": {"mode": "multi", "sort": "desc"}},
          "pluginVersion": "12.2.0",
          "targets": [{"editorMode": "code", "expr": "rate(quantpulse_ticks_ingested_total[1m])", "legendFormat": "ticks/sec", "range": true, "refId": "A"}],
          "title": "Ticks Ingested Rate",
          "description": "Real Finnhub trades landing in Postgres -- this metric existed since Phase 2 but had zero panels using it until now.",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "palette-classic"},
              "custom": {
                "drawStyle": "line", "fillOpacity": 10, "gradientMode": "none", "lineInterpolation": "smooth", "lineWidth": 2,
                "pointSize": 5, "showPoints": "auto", "spanNulls": true, "stacking": {"group": "A", "mode": "none"}
              },
              "mappings": [],
              "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": 0}]},
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 6},
          "id": 5,
          "options": {"legend": {"calcs": ["lastNotNull", "max"], "displayMode": "list", "placement": "bottom", "showLegend": true}, "tooltip": {"mode": "single", "sort": "none"}},
          "pluginVersion": "12.2.0",
          "targets": [{"editorMode": "code", "expr": "quantpulse_active_ws_connections", "legendFormat": "open connections", "range": true, "refId": "A"}],
          "title": "Active WebSocket Connections",
          "description": "Live push subscribers on /api/v1/stream. Self-corrects within ~15s of a disconnect -- see stream.py's KEEPALIVE_SECONDS.",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "palette-classic"},
              "custom": {
                "drawStyle": "bars", "fillOpacity": 60, "gradientMode": "none", "lineWidth": 1,
                "pointSize": 5, "showPoints": "never", "stacking": {"group": "A", "mode": "normal"}
              },
              "mappings": [],
              "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": 0}]},
              "unit": "short"
            },
            "overrides": [
              {"matcher": {"id": "byName", "options": "HIGH"}, "properties": [{"id": "color", "value": {"fixedColor": "red", "mode": "fixed"}}]},
              {"matcher": {"id": "byName", "options": "MEDIUM"}, "properties": [{"id": "color", "value": {"fixedColor": "yellow", "mode": "fixed"}}]}
            ]
          },
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 14},
          "id": 6,
          "options": {"legend": {"calcs": ["sum"], "displayMode": "list", "placement": "bottom", "showLegend": true}, "tooltip": {"mode": "multi", "sort": "desc"}},
          "pluginVersion": "12.2.0",
          "targets": [{"editorMode": "code", "expr": "sum by (severity) (increase(quantpulse_alerts_total[5m]))", "legendFormat": "{{severity}}", "range": true, "refId": "A"}],
          "title": "Alerts by Severity",
          "description": "The rolling z-score anomaly detector's output, broken down HIGH vs MEDIUM -- previously only visible as an unlabeled total.",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {
            "defaults": {
              "mappings": [],
              "thresholds": {"mode": "absolute", "steps": [{"color": "red", "value": 0}, {"color": "yellow", "value": 50}, {"color": "green", "value": 80}]},
              "unit": "percent",
              "max": 100,
              "min": 0
            },
            "overrides": []
          },
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 14},
          "id": 7,
          "options": {
            "orientation": "auto", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false},
            "showThresholdLabels": false, "showThresholdMarkers": true
          },
          "pluginVersion": "12.2.0",
          "targets": [{
            "editorMode": "code",
            "expr": "100 * sum(rate(quantpulse_cache_result_total{result=\"hit\"}[5m])) / clamp_min(sum(rate(quantpulse_cache_result_total[5m])), 0.001)",
            "legendFormat": "hit rate",
            "range": true,
            "refId": "A"
          }],
          "title": "Cache Hit Rate",
          "description": "ticks/latest + summary/* cache-aside reads. A low rate right after a restart is expected -- Redis starts empty and warms up as TTLs get populated.",
          "type": "gauge"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "palette-classic"},
              "custom": {
                "drawStyle": "line", "fillOpacity": 10, "gradientMode": "none", "lineInterpolation": "linear", "lineWidth": 2,
                "pointSize": 5, "showPoints": "auto", "spanNulls": false, "stacking": {"group": "A", "mode": "none"}
              },
              "mappings": [],
              "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": 0}]},
              "unit": "reqps"
            },
            "overrides": []
          },
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 22},
          "id": 8,
          "options": {"legend": {"calcs": [], "displayMode": "list", "placement": "bottom", "showLegend": true}, "tooltip": {"mode": "multi", "sort": "desc"}},
          "pluginVersion": "12.2.0",
          "targets": [{"editorMode": "code", "expr": "sum by (path) (rate(quantpulse_http_requests_total[1m]))", "legendFormat": "{{method}} {{path}}", "range": true, "refId": "A"}],
          "title": "Backend Request Rate",
          "description": "Labeled by route template (not raw path) to keep cardinality bounded -- see main.py's prometheus_request_metrics middleware.",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "palette-classic"},
              "custom": {
                "drawStyle": "line", "fillOpacity": 10, "gradientMode": "none", "lineInterpolation": "linear", "lineWidth": 2,
                "pointSize": 5, "showPoints": "auto", "spanNulls": false, "stacking": {"group": "A", "mode": "none"}
              },
              "mappings": [],
              "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": 0}]},
              "unit": "s"
            },
            "overrides": []
          },
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 22},
          "id": 9,
          "options": {"legend": {"calcs": [], "displayMode": "list", "placement": "bottom", "showLegend": true}, "tooltip": {"mode": "multi", "sort": "desc"}},
          "pluginVersion": "12.2.0",
          "targets": [{
            "editorMode": "code",
            "expr": "histogram_quantile(0.95, sum by (le, path) (rate(quantpulse_http_request_duration_seconds_bucket[5m])))",
            "legendFormat": "p95 {{path}}",
            "range": true,
            "refId": "A"
          }],
          "title": "Backend Request Latency (p95)",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "continuous-GrYlRd"},
              "custom": {
                "drawStyle": "line", "fillOpacity": 20, "gradientMode": "scheme", "lineInterpolation": "smooth", "lineWidth": 2,
                "pointSize": 5, "showPoints": "auto", "spanNulls": false, "stacking": {"group": "A", "mode": "none"}
              },
              "mappings": [],
              "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": 0}]},
              "unit": "bytes"
            },
            "overrides": []
          },
          "gridPos": {"h": 8, "w": 8, "x": 0, "y": 30},
          "id": 10,
          "options": {"legend": {"calcs": [], "displayMode": "hidden", "placement": "bottom", "showLegend": false}, "tooltip": {"mode": "single", "sort": "none"}},
          "pluginVersion": "12.2.0",
          "targets": [{"editorMode": "code", "expr": "redis_memory_used_bytes", "legendFormat": "used", "range": true, "refId": "A"}],
          "title": "Redis Memory Usage",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "continuous-GrYlRd"},
              "custom": {
                "drawStyle": "bars", "fillOpacity": 30, "gradientMode": "none", "lineWidth": 1,
                "pointSize": 5, "showPoints": "never", "stacking": {"group": "A", "mode": "none"}
              },
              "mappings": [],
              "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": 0}]},
              "unit": "ops"
            },
            "overrides": []
          },
          "gridPos": {"h": 8, "w": 8, "x": 8, "y": 30},
          "id": 11,
          "options": {"legend": {"calcs": [], "displayMode": "hidden", "placement": "bottom", "showLegend": false}, "tooltip": {"mode": "single", "sort": "none"}},
          "pluginVersion": "12.2.0",
          "targets": [{"editorMode": "code", "expr": "rate(redis_commands_processed_total[1m])", "legendFormat": "commands/sec", "range": true, "refId": "A"}],
          "title": "Redis Ops/sec",
          "description": "Real pub/sub + cache-aside traffic, from redis_exporter's process-level view -- not the app-side counters above it.",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {
            "defaults": {
              "mappings": [],
              "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": 0}]},
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {"h": 8, "w": 8, "x": 16, "y": 30},
          "id": 12,
          "options": {
            "colorMode": "value", "graphMode": "area", "justifyMode": "auto", "orientation": "auto",
            "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "textMode": "auto"
          },
          "pluginVersion": "12.2.0",
          "targets": [{"editorMode": "code", "expr": "redis_connected_clients", "legendFormat": "clients", "range": true, "refId": "A"}],
          "title": "Redis Connected Clients",
          "type": "stat"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "palette-classic"},
              "custom": {
                "drawStyle": "line", "fillOpacity": 15, "gradientMode": "none", "lineInterpolation": "linear", "lineWidth": 2,
                "pointSize": 5, "showPoints": "auto", "spanNulls": false, "stacking": {"group": "A", "mode": "none"}
              },
              "mappings": [],
              "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": 0}]},
              "unit": "short"
            },
            "overrides": [
              {"matcher": {"id": "byName", "options": "succeeded"}, "properties": [{"id": "color", "value": {"fixedColor": "green", "mode": "fixed"}}]},
              {"matcher": {"id": "byName", "options": "failed"}, "properties": [{"id": "color", "value": {"fixedColor": "red", "mode": "fixed"}}]}
            ]
          },
          "gridPos": {"h": 8, "w": 24, "x": 0, "y": 38},
          "id": 13,
          "options": {"legend": {"calcs": [], "displayMode": "list", "placement": "bottom", "showLegend": true}, "tooltip": {"mode": "multi", "sort": "desc"}},
          "pluginVersion": "12.2.0",
          "targets": [
            {"editorMode": "code", "expr": "sum(kube_job_status_succeeded)", "legendFormat": "succeeded", "range": true, "refId": "A"},
            {"editorMode": "code", "expr": "sum(kube_job_status_failed)", "legendFormat": "failed", "range": true, "refId": "B"}
          ],
          "title": "ai-explainer / ai-daily-summary / ai-symbol-summary Job Outcomes",
          "description": "Every CronJob-created Job across all three AI jobs. A failed spike that's immediately followed by a succeeded one on the same job is the known cold-start DNS race self-healing, not a real outage.",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "continuous-GrYlRd"},
              "custom": {
                "drawStyle": "bars", "fillOpacity": 20, "gradientMode": "scheme", "lineInterpolation": "linear", "lineWidth": 1,
                "pointSize": 5, "showPoints": "auto", "spanNulls": false, "stacking": {"group": "A", "mode": "none"}
              },
              "mappings": [],
              "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": 0}]},
              "unit": "percent"
            },
            "overrides": []
          },
          "gridPos": {"h": 6, "w": 12, "x": 0, "y": 46},
          "id": 14,
          "options": {"legend": {"calcs": [], "displayMode": "hidden", "placement": "bottom", "showLegend": false}, "tooltip": {"mode": "single", "sort": "none"}},
          "pluginVersion": "12.2.0",
          "targets": [{"editorMode": "code", "expr": "rate(process_cpu_seconds_total{job=\"quantpulse-backend\"}[1m]) * 100", "legendFormat": "backend CPU", "range": true, "refId": "A"}],
          "title": "Backend CPU Usage",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "continuous-GrYlRd"},
              "custom": {
                "drawStyle": "bars", "fillOpacity": 20, "gradientMode": "scheme", "lineInterpolation": "smooth", "lineWidth": 1,
                "pointSize": 5, "showPoints": "auto", "spanNulls": false, "stacking": {"group": "A", "mode": "none"}
              },
              "mappings": [],
              "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": 0}]},
              "unit": "bytes"
            },
            "overrides": []
          },
          "gridPos": {"h": 6, "w": 12, "x": 12, "y": 46},
          "id": 15,
          "options": {"legend": {"calcs": [], "displayMode": "hidden", "placement": "bottom", "showLegend": false}, "tooltip": {"mode": "single", "sort": "none"}},
          "pluginVersion": "12.2.0",
          "targets": [{"editorMode": "code", "expr": "process_resident_memory_bytes{job=\"quantpulse-backend\"}", "legendFormat": "backend memory", "range": true, "refId": "A"}],
          "title": "Backend Memory Usage",
          "type": "timeseries"
        }
      ],
      "preload": false,
      "schemaVersion": 42,
      "tags": [
        "quantpulse"
      ],
      "templating": {
        "list": []
      },
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "timepicker": {},
      "timezone": "browser",
      "title": "QuantPulse Monitoring Dashboard",
      "uid": "quantpulse-dashboard",
      "version": 2
    }
