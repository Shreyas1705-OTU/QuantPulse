apiVersion: v1
kind: ConfigMap

metadata:
  name: grafana-dashboard-provider
  namespace: quantpulse

data:
  dashboard.yaml: |
    apiVersion: 1

    providers:
      - name: QuantPulse
        orgId: 1
        folder: ""
        type: file
        disableDeletion: false
        editable: true

        options:
          path: /etc/grafana/provisioning/dashboards