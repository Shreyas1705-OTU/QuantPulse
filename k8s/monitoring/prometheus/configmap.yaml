apiVersion: v1
kind: ConfigMap

metadata:
  name: prometheus-config
  namespace: quantpulse

data:
  prometheus.yml: |
    global:
      scrape_interval: 5s

    scrape_configs:

      - job_name: "quantpulse-backend"

        metrics_path: /metrics

        static_configs:
          - targets:
              - backend:8000

      - job_name: "quantpulse-ingestion"

        metrics_path: /metrics

        static_configs:
          - targets:
              - ingestion:8001