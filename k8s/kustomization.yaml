apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Base: every QuantPulse/QuantPulse resource, exactly as deploy-kind.sh applies
# them today (local images, imagePullPolicy: Never). Kind keeps using
# `kubectl apply -f` on these files directly and is unaffected by this file.
# Cloud environments (see overlays/aks) build on top of this base instead of
# duplicating it, so every change here (env vars, ports, resource limits...)
# stays in one place.

resources:
  - namespace.yaml
  - configmap.yaml
  - secret.yaml

  - postgres/secret_postgres.yaml
  - postgres/service_postgres.yaml
  - postgres/statefulset.yaml

  - redis/deployment.yaml
  - redis/service.yaml

  - backend/deployment.yaml
  - backend/service.yaml

  - frontend/deployment.yaml
  - frontend/service.yaml

  - ingestion/deployment.yaml
  - ingestion/service.yaml

  - ai/explainer-cronjob.yaml
  - ai/daily-summary-cronjob.yaml
  - ai/symbol-summary-cronjob.yaml

  - monitoring/prometheus/configmap.yaml
  - monitoring/prometheus/deployment.yaml
  - monitoring/prometheus/service.yaml

  - monitoring/grafana/dashboard-configmap.yaml
  - monitoring/grafana/datasource-configmap.yaml
  - monitoring/grafana/provider-configmap.yaml
  - monitoring/grafana/deployment.yaml
  - monitoring/grafana/service.yaml

  - monitoring/kube-state-metrics/serviceaccount.yaml
  - monitoring/kube-state-metrics/clusterrole.yaml
  - monitoring/kube-state-metrics/clusterrolebinding.yaml
  - monitoring/kube-state-metrics/deployment.yaml
  - monitoring/kube-state-metrics/service.yaml

  - ingress/ingress.yaml
