apiVersion: apps/v1
kind: StatefulSet

metadata:
  name: postgres
  namespace: cloudpulse

spec:
  serviceName: postgres

  replicas: 1

  selector:
    matchLabels:
      app: postgres

  template:
    metadata:
      labels:
        app: postgres

    spec:
      containers:
        - name: postgres

          image: postgres:16

          ports:
            - containerPort: 5432

          env:

            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: cloudpulse-config
                  key: POSTGRES_USER

            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: cloudpulse-config
                  key: POSTGRES_DB

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD

            # Cloud block storage (e.g. Azure Disk) formats the volume with a
            # filesystem that leaves a lost+found dir at its root, which trips
            # up initdb's "directory must be empty" check if PGDATA points at
            # the mount root directly. Pointing PGDATA at a subdirectory of
            # the mount sidesteps that -- the subdirectory itself is empty.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata

          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data

          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - cloudpulse
                - -d
                - cloudpulse
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6

          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - cloudpulse
                - -d
                - cloudpulse
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3

  volumeClaimTemplates:

    - metadata:
        name: postgres-storage

      spec:
        accessModes:
          - ReadWriteOnce

        resources:
          requests:
            storage: 2Gi