services:

  postgres:
    image: postgres:16
    container_name: quantpulse-postgres

    environment:
      POSTGRES_USER: quantpulse
      POSTGRES_PASSWORD: quantpulse123
      POSTGRES_DB: quantpulse

    ports:
      - "5432:5432"

    volumes:
      - quantpulse-postgres-data:/var/lib/postgresql/data

    restart: unless-stopped


  redis:
    image: redis:7-alpine

    container_name: quantpulse-redis

    ports:
      - "6379:6379"

    restart: unless-stopped


  backend:
    build:
      context: ./backend

    container_name: quantpulse-backend

    environment:
      DATABASE_URL: postgresql://quantpulse:quantpulse123@postgres:5432/quantpulse
      REDIS_URL: redis://redis:6379/0

    ports:
      - "8000:8000"

    depends_on:
      - postgres
      - redis

    restart: unless-stopped


  frontend:
    build:
      context: ./frontend

    container_name: quantpulse-frontend

    ports:
      - "5173:80"

    depends_on:
      - backend

    restart: unless-stopped


  prometheus:
    image: prom/prometheus:latest

    container_name: quantpulse-prometheus

    ports:
      - "9090:9090"

    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml

    depends_on:
      - backend

    restart: unless-stopped


  grafana:
    image: grafana/grafana-oss:latest

    container_name: quantpulse-grafana

    ports:
      - "3000:3000"

    volumes:
      - grafana-storage:/var/lib/grafana

    depends_on:
      - prometheus

    restart: unless-stopped


volumes:
  quantpulse-postgres-data:
  grafana-storage: