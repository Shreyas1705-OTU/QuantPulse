name: Build and Push to ACR

# Builds the backend and frontend images (linux/arm64, matching the
# aks-quantpulse node pool -- see overlays/aks and scripts/deploy-aks.sh)
# and pushes them to ACR on every push to main that touches app code.
#
# This workflow never touches the AKS cluster. Deploying a newly-pushed
# image is a separate, manual step (scripts/deploy-aks.sh), by design --
# keeps CI cheap/automatic while protecting the start/stop cost discipline
# around the cluster itself.

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/build-push-acr.yml"

env:
  ACR_LOGIN_SERVER: quantpulseacrsd.azurecr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: cloudpulse-backend
            context: ./backend
          - image: cloudpulse-frontend
            context: ./frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (arm64 cross-build on the amd64 runner)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push ${{ matrix.image }} (linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.ACR_LOGIN_SERVER }}/${{ matrix.image }}:latest
            ${{ env.ACR_LOGIN_SERVER }}/${{ matrix.image }}:${{ github.sha }}
