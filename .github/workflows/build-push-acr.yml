name: Build and Push to ACR

# Runs the test suite first, then builds the backend/frontend/ingestion/ai
# images (linux/arm64, matching the aks-quantpulse node pool -- see
# overlays/aks and scripts/deploy-aks.sh) and pushes them to ACR on every
# push to main that touches app code. build-and-push only runs if test
# passes -- a broken anomaly-detection/market-hours/service-layer/AI-job
# change never reaches ACR.
#
# This workflow never touches the AKS cluster. Deploying a newly-pushed
# image is a separate, manual step (scripts/deploy-aks.sh), by design --
# keeps CI cheap/automatic while protecting the start/stop cost discipline
# around the cluster itself.

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "ingestion/**"
      - "ai/**"
      - ".github/workflows/build-push-acr.yml"
  workflow_dispatch: {}

env:
  ACR_LOGIN_SERVER: quantpulseacrsd.azurecr.io

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: quantpulse
          POSTGRES_PASSWORD: quantpulse123
          POSTGRES_DB: quantpulse
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install -r ingestion/requirements.txt
          pip install -r ai/requirements.txt
          pip install pytest

      - name: Run Alembic migrations (build the schema tests run against)
        working-directory: backend
        env:
          DATABASE_URL: postgresql://quantpulse:quantpulse123@localhost:5432/quantpulse
        run: alembic upgrade head

      - name: Run test suite
        env:
          TEST_DATABASE_URL: postgresql://quantpulse:quantpulse123@localhost:5432/quantpulse
        run: pytest backend/tests/ ingestion/tests/ ai/tests/ -v

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: quantpulse-backend
            context: ./backend
          - image: quantpulse-frontend
            context: ./frontend
          - image: quantpulse-ingestion
            context: ./ingestion
          - image: quantpulse-ai
            context: ./ai

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (arm64 cross-build on the amd64 runner)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push ${{ matrix.image }} (linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.ACR_LOGIN_SERVER }}/${{ matrix.image }}:latest
            ${{ env.ACR_LOGIN_SERVER }}/${{ matrix.image }}:${{ github.sha }}
