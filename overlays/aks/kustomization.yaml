apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# AKS overlay: builds on the shared base (../../) and patches only what
# differs for a real cloud cluster — image source and pull policy. Everything
# else (ports, env, probes, replicas) is inherited from the base untouched.

resources:
  - ../../k8s

# Rewrites `image: quantpulse-backend:latest` / `quantpulse-frontend:latest`
# to the ACR-hosted images built via `docker buildx` + pushed for
# linux/arm64. __ACR_LOGIN_SERVER__ and __IMAGE_TAG__ are placeholders, not
# real values -- kustomize has no templating, so deploy-aks.sh substitutes
# both at render time (from $ACR_NAME, which defaults to this project's own
# but is overridable, and a tag computed from the current git commit) via
# `kubectl kustomize | sed | kubectl apply -f -` rather than
# `kubectl apply -k` directly. This is what makes the same overlay work
# against anyone's ACR, not just this project's own -- see
# scripts/env-azure.example.sh. Matches by image *name*, so the base
# files never need to know about ACR either way.
#
# __IMAGE_TAG__ specifically (not a hardcoded `latest`) is what makes
# imagePullPolicy: IfNotPresent below actually correct, not just cheap --
# see the patches comment.
images:
  - name: quantpulse-backend
    newName: __ACR_LOGIN_SERVER__/quantpulse-backend
    newTag: __IMAGE_TAG__
  - name: quantpulse-frontend
    newName: __ACR_LOGIN_SERVER__/quantpulse-frontend
    newTag: __IMAGE_TAG__
  - name: quantpulse-ingestion
    newName: __ACR_LOGIN_SERVER__/quantpulse-ingestion
    newTag: __IMAGE_TAG__
  - name: quantpulse-ai
    newName: __ACR_LOGIN_SERVER__/quantpulse-ai
    newTag: __IMAGE_TAG__

# Never on Kind means "only use what's already loaded into the node" — the
# right default for a from-source local dev loop.
#
# On AKS, every workload gets IfNotPresent -- correct here (unlike an
# earlier version of this file) specifically because the tag above is no
# longer the mutable `latest`: deploy-aks.sh computes a real per-deploy tag
# (the current git commit, `-dirty-<timestamp>` appended for uncommitted
# changes so repeated local iterations still get a genuinely new tag each
# time), so IfNotPresent's "does *some* image already exist on the node
# under this exact name:tag" check is now asking the right question -- a
# new deploy always means a new tag string the node has never seen, so it
# always pulls, and a redeploy of unchanged code never wastes a pull.
#
# This replaces an earlier fix that kept `latest` and set every pull
# policy to Always instead: that worked, but depended on Always correctly
# out-racing ACR's own tag-propagation lag (observed live, twice, as a
# several-second gap between a push completing and `:latest` resolving to
# it registry-side) -- correct eventually, but not guaranteed instant. A
# real per-deploy tag removes the ambiguity at the root: there is no
# stale image to accidentally serve under a tag nothing pushed to it.
#
# One consequence: `kubectl apply` on a new tag is itself a real Deployment
# spec change now, so Kubernetes rolls it on its own -- deploy-aks.sh no
# longer needs an explicit `kubectl rollout restart` to force a pod
# refresh (that was only ever a workaround for `latest` never looking
# "changed" to kubectl).
patches:
  - target:
      kind: Deployment
      name: backend
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
  - target:
      kind: Deployment
      name: frontend
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
  - target:
      kind: Deployment
      name: ingestion
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
  - target:
      kind: CronJob
      name: ai-explainer
    patch: |-
      - op: replace
        path: /spec/jobTemplate/spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
  - target:
      kind: CronJob
      name: ai-daily-summary
    patch: |-
      - op: replace
        path: /spec/jobTemplate/spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
  - target:
      kind: CronJob
      name: ai-symbol-summary
    patch: |-
      - op: replace
        path: /spec/jobTemplate/spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
