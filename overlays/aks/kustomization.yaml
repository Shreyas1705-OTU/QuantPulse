apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# AKS overlay: builds on the shared base (../../) and patches only what
# differs for a real cloud cluster — image source and pull policy. Everything
# else (ports, env, probes, replicas) is inherited from the base untouched.

resources:
  - ../../k8s

# Rewrites `image: quantpulse-backend:latest` / `quantpulse-frontend:latest`
# to the ACR-hosted images built via `docker buildx` + pushed for
# linux/arm64. __ACR_LOGIN_SERVER__ is a placeholder, not a real host --
# kustomize has no templating, so deploy-aks.sh substitutes it for the
# real registry (from $ACR_NAME, which defaults to this project's own but
# is overridable) at render time, via
# `kubectl kustomize | sed | kubectl apply -f -` rather than
# `kubectl apply -k` directly. This is what makes the same overlay work
# against anyone's ACR, not just this project's own -- see
# scripts/env-azure.example.sh. Matches by image *name*, so the base
# files never need to know about ACR either way.
images:
  - name: quantpulse-backend
    newName: __ACR_LOGIN_SERVER__/quantpulse-backend
    newTag: latest
  - name: quantpulse-frontend
    newName: __ACR_LOGIN_SERVER__/quantpulse-frontend
    newTag: latest
  - name: quantpulse-ingestion
    newName: __ACR_LOGIN_SERVER__/quantpulse-ingestion
    newTag: latest
  - name: quantpulse-ai
    newName: __ACR_LOGIN_SERVER__/quantpulse-ai
    newTag: latest

# Never on Kind means "only use what's already loaded into the node" — the
# right default for a from-source local dev loop. On AKS there's no local
# image to reuse, so every workload here gets Always, not IfNotPresent --
# newTag above is the mutable `latest` tag, and IfNotPresent only checks
# whether *some* image already exists on the node under that name:tag; it
# never compares against what the registry currently holds. That bit
# real: a redeploy's freshly-pushed backend image (new migration file
# included) got pushed to ACR fine, `kubectl rollout restart` even forced
# a brand new pod -- but the node still had an OLDER digest cached under
# `quantpulse-backend:latest` from an earlier deploy, so the new pod ran
# with stale code anyway (confirmed by comparing the running pod's
# imageID against ACR's actual latest digest). rollout restart forces a
# new POD; it does nothing about which image that pod ends up running.
# Always is the only pull policy that's actually correct for a mutable
# tag redeployed to a long-lived node -- the extra registry check per
# pod start is negligible at this project's scale.
patches:
  - target:
      kind: Deployment
      name: backend
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always
  - target:
      kind: Deployment
      name: frontend
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always
  - target:
      kind: Deployment
      name: ingestion
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always
  - target:
      kind: CronJob
      name: ai-explainer
    patch: |-
      - op: replace
        path: /spec/jobTemplate/spec/template/spec/containers/0/imagePullPolicy
        value: Always
  - target:
      kind: CronJob
      name: ai-daily-summary
    patch: |-
      - op: replace
        path: /spec/jobTemplate/spec/template/spec/containers/0/imagePullPolicy
        value: Always
  - target:
      kind: CronJob
      name: ai-symbol-summary
    patch: |-
      - op: replace
        path: /spec/jobTemplate/spec/template/spec/containers/0/imagePullPolicy
        value: Always
