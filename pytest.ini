[pytest]
# backend/tests/, ingestion/tests/, and ai/tests/ are three separate
# packages that all happen to be named "tests" -- the default import
# mode resolves modules by dotted name (tests.conftest), which collides
# across all three. importlib mode resolves by file path instead, so
# same-named test packages in different services never conflict.
addopts = --import-mode=importlib
