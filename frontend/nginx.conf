server {

    listen 80;

    server_name localhost;

    root /usr/share/nginx/html;

    index index.html;

    location / {

        try_files $uri /index.html;

    }

    location /api/ {

        proxy_pass http://backend:8000/api/;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket upgrade (app/routers/stream.py's WS /api/v1/stream) --
        # a plain proxy_pass doesn't forward the Upgrade handshake on its
        # own; $http_upgrade/$connection_upgrade below are what make an ws://
        # request through this same /api/ location actually upgrade
        # instead of getting proxied as a dead, unread HTTP response.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # A long-lived WS connection sitting idle between trades (real,
        # not hypothetical -- forex/equities can go quiet) looks the same
        # to nginx as a stalled response unless read_timeout comfortably
        # outlasts stream.py's own 15s keepalive ping.
        proxy_read_timeout 60s;

    }

}

# Bridges nginx's WS-only $http_upgrade to the Connection header's two
# valid values -- "upgrade" when the client is asking to upgrade the
# protocol, "close" for every ordinary HTTP request through the same
# location (map falls through to the default here since /api/ also
# serves plain REST calls, not just the WS route).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}